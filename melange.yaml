# melange.yaml — build mache from source as an APK
#
#   melange build melange.yaml --signing-key melange.rsa --out-dir ./packages
#
# Builds the mache Go binary against the in-tree source. The build is
# CGO-free: in-process tree-sitter was removed in v0.18.0 (ADR-0012 step 4),
# so there are no grammar bindings to link. No ley-line linkage either (see
# ADR-0006) — mache consumes leyline as a pure-Go UDS daemon client, not via
# CGO/FFI.

package:
  name: mache
  # Keep in sync with internal/buildinfo/version.txt — `task version:check`
  # asserts they agree. The binary's version comes from the embedded
  # buildinfo, not from this field.
  version: 0.19.0
  epoch: 0
  description: "Structural code intelligence — graph projection of source as MCP tools"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libgcc

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - build-base
      - ca-certificates-bundle
      - git
      - go-1.25

pipeline:
  # Pure Go since ADR-0012 step 4 (mache-37ae8b) — in-process tree-sitter was
  # removed, so the build is CGO-free. Raw `go build` (not the `go/build`
  # pipeline) is kept for ldflags control.
  - runs: |
      export CGO_ENABLED=0
      # Version is embedded via internal/buildinfo, not injected here.
      go build \
        -ldflags "-s -w" \
        -o mache \
        .
      install -Dm755 mache "${{targets.destdir}}/usr/bin/mache"

test:
  pipeline:
    - runs: |
        mache --help
