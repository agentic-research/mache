# melange.yaml — build mache from source as an APK
#
#   melange build melange.yaml --signing-key melange.rsa --out-dir ./packages
#
# Builds the mache Go binary against the in-tree source. CGO is required
# because internal/treesitter/elixir uses cgo bindings to the elixir
# tree-sitter grammar. No ley-line linkage (see ADR-0006) — the leyline
# CGO client is gated behind the "leyline" build tag and not enabled here.

package:
  name: mache
  # Keep in sync with internal/buildinfo/version.txt — `task version:check`
  # asserts they agree. The binary's version comes from the embedded
  # buildinfo, not from this field.
  version: 0.16.2
  epoch: 0
  description: "Structural code intelligence — graph projection of source as MCP tools"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libgcc

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - build-base
      - ca-certificates-bundle
      - git
      - go-1.25

pipeline:
  # Raw `go build` (not the `go/build` pipeline) so CGO_ENABLED=1 can be
  # set inline — the built-in pipeline step doesn't accept arbitrary env
  # in this melange release.
  - runs: |
      export CGO_ENABLED=1
      # Version is embedded via internal/buildinfo, not injected here.
      go build \
        -ldflags "-s -w" \
        -o mache \
        .
      install -Dm755 mache "${{targets.destdir}}/usr/bin/mache"

test:
  pipeline:
    - runs: |
        mache --help
