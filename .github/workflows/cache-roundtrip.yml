# Portable-cache round-trip CI (bead mache-aeb262 Phase 5).
#
# Runs the cache feature's end-to-end self-test on every push + PR.
# All inputs are commit-controlled — no untrusted PR/issue body/title
# is interpolated into run: blocks.

name: cache-roundtrip

on:
  push:
    branches: [main]
    paths:
      - 'cmd/cache*.go'
      - 'cmd/cache_oci*.go'
      - 'cmd/cache_remote*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cache-roundtrip.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/cache*.go'
      - 'cmd/cache_oci*.go'
      - 'cmd/cache_remote*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cache-roundtrip.yml'

permissions:
  contents: read

jobs:
  roundtrip:
    name: cache round-trip
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        # Install via Go's module proxy (GitHub's release CDN has 502'd).
        # Keep this pinned version in lock-step with ci.yml.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      # 22 cache tests: 7 local push/pull + 12 OCI client + 3 e2e remote.
      # Run the Taskfile recipe so CI and `task cache:test` stay 1:1.
      - name: Run cache tests
        run: task cache:test

      # The "feature still works end-to-end" smoke test.
      - name: Round-trip self-test
        run: task cache:roundtrip
