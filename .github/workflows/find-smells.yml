name: find_smells

# Structural smell GATE for mache PRs. Invokes the `task smells`
# Taskfile target (taskfile-ci-parity: CI calls the target, it does
# NOT re-implement the command inline) — the same gate `task check`
# and `task ci` run locally and the pre-push hook enforces. The target
# builds mache, projects the TRACKED tree with `--backend leyline`, and
# runs `find-smells --rule '*' --tags=gate --baseline
# docs/smell-baseline.json`, exiting non-zero on any NEW finding.
#
# It used to say the `_ast`-dependent rules skip automatically here on a
# standalone (no-LLO) .db. That stopped being true when mache-608a3c
# consolidated the gate onto leyline: the projection carries `_ast`, so
# every gate rule runs and nothing skips. The claim outlived the config
# by months, which is the failure mache-ddf14b is about — a skipped rule
# reports zero findings, indistinguishable from a rule that ran clean.
#
# That is now enforced rather than described. The baseline records which
# rules could not run when it was written (`rules_skipped`), so if this
# job ever loses a rule the gate fails with COVERAGE REGRESSION instead
# of reporting green on an analysis that did not happen.
#
# This REPLACES the previous advisory comment-only workflow — a new
# smell now fails the PR. To grandfather a deliberate structural
# change, regenerate the baseline (`task smells:baseline`) and commit
# docs/smell-baseline.json in the same PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Source, the rule definitions, the baseline, and this workflow —
      # anything that can change the finding set vs the baseline.
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/smells/rules/*.json'
      - 'docs/smell-baseline.json'
      - '.github/workflows/find-smells.yml'

permissions:
  contents: read

jobs:
  smells:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # LFS-tracked tree-sitter grammar fixtures are needed to BUILD
          # mache at all (the binary is CGO + tree-sitter); parser.c is
          # otherwise an LFS pointer. Not for the backend — the gate
          # projects with leyline (mache-608a3c).
          lfs: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        # Install via Go's module proxy (GitHub's release CDN has 502'd).
        # Keep this pinned version in lock-step with ci.yml.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Smell gate
        # Invoke the Taskfile target — do NOT re-implement the command
        # inline (taskfile-ci-parity). `task smells` builds mache, indexes
        # this repo, and fails on any NEW finding vs docs/smell-baseline.json.
        run: task smells
