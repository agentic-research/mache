name: Release

# Build mache binaries and publish a GitHub release.
#
# mache links NO external C libraries. CGO is enabled solely for the
# tree-sitter grammars, which carry their own #cgo directives over vendored
# parser.c. The leyline integration in released binaries is the pure-Go UDS
# daemon client (internal/leyline); the cgo FFI client
# (internal/leyline/client.go) is `//go:build leyline` and is NOT compiled
# here, so the released binary pulls zero symbols from libleyline_fs and
# needs no fuse headers/framework. Net effect: no privileged access (sudo),
# no fuse_t runtime dependency — the binary runs on any host.

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [leyline-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0). Leave empty for dev build.'
        type: string

permissions: {}

env:
  TAG: ${{ inputs.tag || github.event.client_payload.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mache-darwin-arm64
          - os: ubuntu-latest
            artifact: mache-linux-amd64
          - os: ubuntu-24.04-arm
            artifact: mache-linux-arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout mache
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
          # Full history + tags so `git describe` works for the dev fallback.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build mache
        # PURE GO since ADR-0012 step 4 (mache-37ae8b): in-process tree-sitter
        # was removed — leyline is the universal parser — so the release binary
        # is CGO-free. (The leyline_fs FFI in internal/leyline/client.go is a
        # separate `//go:build leyline` dev-only surface, never in the release
        # binary.) The binary's cmd.Version is injected from the release TAG so
        # it matches the tag exactly; the CLEAN release base in
        # internal/buildinfo (version.txt) is what server.json + melange derive
        # from — gated to agree below.
        env:
          CGO_ENABLED: '0'
          TAG: ${{ env.TAG }}
        run: |
          # TAG can originate from repository_dispatch client_payload (attacker-
          # settable), so validate its shape before it's used anywhere — reject
          # anything that isn't a clean semver release tag (no pre-release/build
          # suffix; release tags are always vMAJOR.MINOR.PATCH and must equal the
          # clean version.txt base checked below). Passed via env, not an inline
          # GitHub expression. The error message does NOT echo the raw TAG: pre-validation
          # it may contain a CR/newline that would break out of the ::error::
          # workflow command (workflow-command injection). After this gate TAG is
          # known clean, so the mismatch error below can safely include it.
          if [ -n "${TAG}" ] && ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag failed validation — expected a clean semver tag like v0.10.0 (no pre-release or build suffix)"
            exit 1
          fi
          # Release-honesty gate: the tag must match the clean release base in
          # version.txt, so we never publish a binary/package whose version
          # disagrees with the tag. Bump internal/buildinfo/version.txt (and
          # melange.yaml + server.json) to the new version before tagging.
          BASE="v$(tr -d '[:space:]' < internal/buildinfo/version.txt)"
          if [ -n "${TAG}" ] && [ "${TAG}" != "${BASE}" ]; then
            echo "::error::release tag ${TAG} != version.txt ${BASE} — bump internal/buildinfo/version.txt, melange.yaml, and server.json to match the tag before releasing"
            exit 1
          fi
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          VERSION="${TAG:-$(git describe --tags --always --dirty)}"
          go build \
            -ldflags "-s -w \
              -X github.com/agentic-research/mache/cmd.Commit=${GIT_COMMIT} \
              -X github.com/agentic-research/mache/cmd.Date=${BUILD_DATE} \
              -X github.com/agentic-research/mache/cmd.buildVersion=${VERSION}" \
            -o ${{ matrix.artifact }} .

      - name: Codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign -s - --force --deep --entitlements entitlements.plist ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  image:
    # Same gate as `release`: only publish on an actual release tag, never
    # from a bare workflow_dispatch (env.TAG could be empty, which would
    # push a malformed `ghcr.io/.../mache:` tag).
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' || github.event.client_payload.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr
      id-token: write       # cosign keyless + SLSA provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read pinned leyline version
        id: ll
        run: |
          set -euo pipefail
          # Single source of truth: the const mache already downloads by.
          v=$(grep -oE 'leylineBinaryVersion = "v[0-9.]+"' internal/leyline/socket.go | grep -oE 'v[0-9.]+')
          if [ -z "$v" ]; then
            echo "::error::could not parse leylineBinaryVersion from internal/leyline/socket.go — the const format may have changed" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Download mache linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mache-linux-*
          path: artifacts

      - name: Assemble per-arch build context
        env:
          LL_VERSION: ${{ steps.ll.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p image/linux-amd64 image/linux-arm64
          mv artifacts/mache-linux-amd64/mache-linux-amd64 image/linux-amd64/mache
          mv artifacts/mache-linux-arm64/mache-linux-arm64 image/linux-arm64/mache
          for arch in amd64 arm64; do
            curl -sSfL "https://github.com/agentic-research/ley-line-open/releases/download/${LL_VERSION}/leyline-linux-${arch}" \
              -o "image/linux-${arch}/leyline"
          done
          chmod +x image/linux-*/mache image/linux-*/leyline

      - name: Smoke test the image (runtime — catches glibc/lib mismatches before push)
        # `docker build` succeeds even if the bundled leyline can't run (COPY
        # never executes it) — the failure is runtime-only. Build + RUN the
        # runner-arch image and assert leyline actually executes, so a
        # base/glibc mismatch fails the release job instead of publishing a
        # broken image. mache is exercised via `version`; leyline via `--version`.
        run: |
          set -euo pipefail
          docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 -t mache-smoke:ci .
          docker run --rm --entrypoint /usr/local/bin/mache mache-smoke:ci version
          docker run --rm --entrypoint /usr/local/bin/leyline mache-smoke:ci --version

      - name: Log in to ghcr
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          tags: |
            ghcr.io/agentic-research/mache:${{ env.TAG }}
            ghcr.io/agentic-research/mache:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/agentic-research/mache@${DIGEST}"

      - name: Verify the published image (pullable + runs + signature valid)
        # Post-push guard on the distribution contract (packages[].oci in
        # server.json points here). The pre-push smoke step catches glibc/lib
        # mismatches on the locally-built image; this asserts the *published*
        # artifact: both tags resolve, the image runs, and the cosign keyless
        # signature verifies against this workflow's identity. Fails the
        # release if any regresses (e.g. a package-visibility/ACL change makes
        # it unpullable, or signing silently no-ops).
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/agentic-research/mache"
          # Both tags are resolvable (pullable) from the registry.
          for t in "${TAG}" latest; do
            docker buildx imagetools inspect "${IMG}:${t}" >/dev/null
            echo "pullable: ${IMG}:${t}"
          done
          # The published image executes (runner-arch variant of the manifest list).
          docker run --rm --entrypoint /usr/local/bin/mache "${IMG}@${DIGEST}" version
          # Keyless cosign signature verifies against THIS workflow's OIDC identity.
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/agentic-research/mache/\.github/workflows/release\.yml@" \
            "${IMG}@${DIGEST}" >/dev/null
          echo "verified: pullable (both tags), runs, cosign signature valid"

  release:
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' || github.event.client_payload.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # contents: write to publish the release; no OIDC consumer here.
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
          path: dist/

      - name: Create checksums
        run: |
          cd dist
          sha256sum mache-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/mache-*
            dist/checksums-sha256.txt
