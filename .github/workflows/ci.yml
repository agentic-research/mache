name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify change
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- . \
            ':(glob,exclude)**/*.md' \
            ':(glob,exclude)docs/**' \
            ':(glob,exclude)examples/**' \
            ':(exclude)LICENSE' \
            ':(exclude).gitignore'; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        # Use `go install` instead of arduino/setup-task to bypass
        # GitHub's release CDN — that download has 502'd on us
        # (e.g., PR #284 rerun). Go's module proxy is far more
        # reliable, and pinning the version here keeps CI
        # reproducible. Side benefit: no Node 20 deprecation shim.
        #
        # GOTOOLCHAIN=auto so Go can fetch the toolchain task v3.50.0
        # requires (>=1.25.8) without forcing the same upgrade on
        # mache itself. setup-go v6 defaults to GOTOOLCHAIN=local.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Build
        run: task build

      - name: Test
        # `task test` owns required-backend provisioning and refreshes the
        # exact SHA-pinned published Leyline artifact before Go tests run.
        run: task test

  lint:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        # Install via Go's module proxy (GitHub's release CDN has 502'd).
        # Keep this pinned version in lock-step with the build/test job.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Vet
        run: task vet

      - name: Actions lint (actionlint + SHA-pin)
        # actionlint (workflow semantics + shellcheck of `run:` blocks) plus the
        # SHA-pin supply-chain gate. Same `task lint:actions` a developer runs
        # locally (mache-466a65 / mache-b8900d). actionlint runs via `go run`.
        run: task lint:actions

      - name: YAML lint
        # yamllint over tracked CI/build YAML (relaxed .yamllint). Same
        # `task lint:yaml` a developer runs; CI provides the tool (mache-466a65).
        run: |
          python3 -m pip install --quiet yamllint
          task lint:yaml

      - name: Docs lint
        # Fail if a top-level doc's covers-version drifts from the latest
        # CHANGELOG release, or a mache language-count claim goes stale
        # (mache-27347d). Same `task docs:lint` a developer runs locally —
        # this closes the local==CI gap that let the v0.12.0 release ship
        # with six stale covers-version markers undetected.
        run: task docs:lint

      - name: Smell gate (leyline / _ast)
        # Single structural smell gate: build a leyline _ast .db of the tracked
        # tree + fail on NEW findings vs the committed baseline (W5 ratchet,
        # mache-4da90e). The _ast .db is a superset of the old pure-Go .db, so
        # ALL `gate`-tagged rules run on it — the former pure-Go tree-sitter
        # `smells` gate was folded in here (mache-608a3c; CGO removal
        # mache-37ae8b). Local == CI: the same `task smells` a developer runs;
        # mache auto-downloads the pinned leyline.
        run: task smells

      - name: Format check (gofumpt)
        # task fmt:check is the single source for the pinned gofumpt
        # invocation (it diffs instead of writing, so it's CI-safe and
        # can't disagree with the local `task fmt`).
        env:
          GOTOOLCHAIN: auto
        run: task fmt:check

      # Escape hatch: the golangci-lint *action* (not `task lint`) is kept
      # deliberately — it provides inline PR annotations + result caching
      # that a bare `task lint` run can't. Both invoke golangci-lint against
      # the same .golangci config, so the linter behavior is identical.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

  server-json-drift:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    # Self-maintaining MCP Registry surface — fails the build if the
    # committed server.json drifts from what tools/server-json-gen
    # would emit today. Mirrors the discipline ley-line-open ships
    # under bead `ley-line-open-f10abb`. See bead `mache-802d2b`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: server.json drift check
        run: task gen:server-json:check

  install-verify:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    # The INSTALL gate (bead mache-19326d). Every other CI job exercises the
    # source tree; this one exercises an artifact a user could actually have.
    # It installs mache the way `task install` does and then verifies the
    # INSTALLED binary: the leyline it resolves is the pin (with a deliberately
    # stale leyline planted first on PATH), the version it reports is one this
    # tree could have produced, and the core MCP tools return the expected
    # values for a fixture it projects itself.
    #
    # CI invokes the Taskfile target, never the commands — a developer running
    # `task install:verify` runs byte-identical checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # merge-base --is-ancestor needs real history to answer "was this
          # binary built from this tree"; a depth-1 checkout has none.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Install mache
        run: task install

      - name: Verify the installed binary
        run: task install:verify BIN="$HOME/.local/bin/mache"

      - name: Verify the published image (clean HOME)
        # Deliberately NOT MACHE_VERIFY_REQUIRE_DOCKER: on a commit that has
        # bumped version.txt ahead of the last release, the image for that
        # version does not exist yet and the leg skips, which is honest. The
        # release workflow is where that skip should become a failure.
        run: task install:verify:docker

  required:
    name: CI required
    if: always()
    needs: [changes, test, lint, server-json-drift, install-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SERVER_JSON_RESULT: ${{ needs.server-json-drift.result }}
          INSTALL_VERIFY_RESULT: ${{ needs.install-verify.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          case "$HEAVY" in
            false) exit 0 ;;
            true) ;;
            *) echo "change classifier produced invalid value: $HEAVY" >&2; exit 1 ;;
          esac
          test "$TEST_RESULT" = "success"
          test "$LINT_RESULT" = "success"
          test "$SERVER_JSON_RESULT" = "success"
          test "$INSTALL_VERIFY_RESULT" = "success"
