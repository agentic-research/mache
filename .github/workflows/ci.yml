name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    # Mirror push's paths-ignore so doc-only PRs don't run full CI
    # (test + integration ≈ 5 min per matrix entry + exposure to
    # known CGO flakes on changes that don't touch code).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          lfs: true

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install Task
        # Use `go install` instead of arduino/setup-task to bypass
        # GitHub's release CDN — that download has 502'd on us
        # (e.g., PR #284 rerun). Go's module proxy is far more
        # reliable, and pinning the version here keeps CI
        # reproducible. Side benefit: no Node 20 deprecation shim.
        #
        # GOTOOLCHAIN=auto so Go can fetch the toolchain task v3.50.0
        # requires (>=1.25.8) without forcing the same upgrade on
        # mache itself. setup-go v6 defaults to GOTOOLCHAIN=local.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Build
        run: task build

      - name: Test
        run: task test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          lfs: true

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format check (gofumpt)
        # Pin gofumpt so CI fails reproducibly. @latest meant a
        # local pre-commit running an older version could disagree
        # with CI silently — pin matches the one installed locally
        # via the Taskfile / pre-commit hooks. Bump together when
        # we move forward.
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@v0.9.2
          gofumpt -d -extra . | tee /dev/stderr | (! grep .)

      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: latest

  server-json-drift:
    # Self-maintaining MCP Registry surface — fails the build if the
    # committed server.json drifts from what tools/server-json-gen
    # would emit today. Mirrors the discipline ley-line-open ships
    # under bead `ley-line-open-f10abb`. See bead `mache-802d2b`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          lfs: true

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install Task
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: server.json drift check
        run: task gen:server-json:check
