name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: true

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install Task
        # Use `go install` instead of arduino/setup-task to bypass
        # GitHub's release CDN — that download has 502'd on us
        # (e.g., PR #284 rerun). Go's module proxy is far more
        # reliable, and pinning the version here keeps CI
        # reproducible. Side benefit: no Node 20 deprecation shim.
        #
        # GOTOOLCHAIN=auto so Go can fetch the toolchain task v3.50.0
        # requires (>=1.25.8) without forcing the same upgrade on
        # mache itself. setup-go v6 defaults to GOTOOLCHAIN=local.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Build
        run: task build

      - name: Test
        run: task test

  notify-kiln:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint]
    runs-on: ubuntu-latest
    # Best-effort cross-repo dispatch. The OIDC exchange against
    # octo-sts depends on a trust policy in the kiln repo; if that
    # trust isn't established yet, the step fails and we don't
    # want to mark the whole CI run as failed (the test + lint jobs
    # are the gate). Continue-on-error keeps the run green when
    # this is the only failing job.
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Exchange OIDC → GitHub token (octo-sts)
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: agentic-research/kiln
          identity: mache-ci

      - name: Trigger kiln rebuild
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          gh api repos/agentic-research/kiln/dispatches \
            -f event_type=upstream-update \
            -f 'client_payload[repo]=agentic-research/mache'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: true

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format check (gofumpt)
        run: |
          set -euo pipefail
          go install mvdan.cc/gofumpt@latest
          gofumpt -d -extra . | tee /dev/stderr | (! grep .)

      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: latest
