name: Integration Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify change
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- . \
            ':(glob,exclude)**/*.md' \
            ':(glob,exclude)docs/**' \
            ':(glob,exclude)examples/**' \
            ':(exclude)LICENSE' \
            ':(exclude).gitignore'; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          fi

  integration:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: integration (${{ matrix.os }})
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install Task
        # See ci.yml — go install bypasses GitHub's release CDN.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Run Integration Tests
        # `task test` owns required-backend provisioning and refreshes the
        # exact SHA-pinned published Leyline artifact before Go tests run.
        run: task test -- -run TestIntegration -v ./tests/

      # Large-tier whole-repo E2E is gated out of the -race unit run in ci.yml
      # because -race + pure-Go SQLite over the whole repo blows the 20m budget
      # (mache-4f3840). Keep the sentinel and distinct-corpora invocations
      # separate so each suite owns its timeout and verbose progress is visible.
      # One `go test` invocation PER BACKEND, so each gets its own -timeout
      # budget sized to the work it actually does (mache-f06138).
      #
      # It used to run both backends in one process against a single 25m
      # budget, and the macOS runner finished in 22m53s on a re-run of the
      # commit that had just timed out at 25m0s — under two minutes of
      # headroom, so runner variance decided the outcome rather than the code.
      # Measured locally: 102s for both, 40s memory, 70s sqlite. The budget
      # was therefore sized against the SUM while the slowest single unit of
      # work is ~70% of it. Splitting also names which backend hung instead of
      # reporting "the test timed out", and removes the duplicate leyline
      # parse of the same immutable tree that one shared process performed.
      #
      # Looped rather than written twice: two near-identical steps are how the
      # flags drift apart.
      - name: Large-tier E2E (mache-self sentinel, per backend, no -race)
        env:
          MACHE_E2E_LARGE: '1'
        run: |
          set -euo pipefail
          for backend in memory sqlite; do
            echo "::group::mache-self sentinel — $backend backend"
            go test -tags boltdb -timeout 25m -run "^TestE2E_MacheOnMache\$/$backend" -v ./internal/mcpserve/ 2>&1 \
              | sed '/\[WARN\] duplicate construct name/d'
            echo "::endgroup::"
          done

      - name: Large-tier E2E (distinct real corpora, no -race)
        env:
          MACHE_E2E_LARGE: '1'
        run: |
          set -o pipefail
          go test -tags boltdb -timeout 25m -run '^TestE2E_RealCorpora$' -v ./internal/mcpserve/ 2>&1 \
            | sed '/\[WARN\] duplicate construct name/d'

  required:
    name: Integration required
    if: always()
    needs: [changes, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable integration job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          case "$HEAVY" in
            false) exit 0 ;;
            true) ;;
            *) echo "change classifier produced invalid value: $HEAVY" >&2; exit 1 ;;
          esac
          test "$INTEGRATION_RESULT" = "success"
