name: Integration Test

on:
  pull_request:
    branches:
      - main
    # Mirror push's paths-ignore so doc-only PRs don't pay
    # the integration suite cost (~3 min per OS).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: integration (${{ matrix.os }})
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install Task
        # See ci.yml — go install bypasses GitHub's release CDN.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      # Provision the pinned leyline BEFORE any test step: `task test` runs the
      # sole-parser projection tests, which fail-not-skip in CI without leyline
      # (mache-01c467). ci.yml orders this the same way.
      - name: Provision leyline
        run: task leyline:ensure

      - name: Run Integration Tests
        run: task test -- -run TestIntegration -v ./tests/

      # Large-tier whole-repo E2E (mache-self, real corpora). These are gated
      # out of the -race unit run in ci.yml because -race + pure-Go SQLite over
      # the whole repo blows the 20m budget (mache-4f3840); here they run
      # WITHOUT -race and with the large-tier opt-in, so coverage is preserved.
      - name: Large-tier E2E (whole-repo projections, no -race)
        env:
          MACHE_E2E_LARGE: '1'
        run: go test -tags boltdb -timeout 25m -run 'TestE2E_MacheOnMache|TestE2E_RealCorpora' ./cmd/
