name: 'mache find-smells'
description: 'Run the mache structural smell ratchet gate over the caller''s checkout; fail on new-vs-baseline findings and upload SARIF to code-scanning.'

inputs:
  mache-version:
    description: >-
      mache release tag to download mache-linux-amd64 from.
      >= v0.17.0 ships gate-tagged rules, so the ratchet runs the same
      `--tags=gate` selection as mache's own Taskfile gate (min-0
      firehose rules like cyclomatic_complexity are excluded from the
      gate but still available ad hoc). >= v0.13.0 auto-provisions
      leyline during `mache build` (backend auto), so the _ast-backed
      rules run in addition to the cross-reference rules; absent-table
      rules are skipped automatically. Versions below v0.17.0 have no
      gate-tagged rules and fail with 'no rules match' — pin an older
      action revision instead of overriding this downward.
    required: false
    default: 'v0.17.0'
  schema:
    description: >-
      Path to a mache topology schema. Empty uses FCA schema inference.
      When set, the build is forced to --backend tree-sitter for
      LANGUAGE COVERAGE: since v0.17.0 the leyline backend honors
      build-time schemas, but the pinned leyline parses ~11 of the 28
      registry languages while the in-process tree-sitter tier covers
      all 28. The forcing goes away when the CGO tree-sitter backend is
      deleted (mache-37ae8b); unparseable schema languages then fail
      loudly via the coverage guard.
    required: false
    default: ''
  baseline:
    description: >-
      Path to the committed smell baseline (the ratchet floor). This
      default is THE documented baseline location — mache's own
      Taskfile `smells` gate uses the same path, and
      cmd/find_smells_action_test.go asserts the two stay in sync. If
      the gate-consolidation workstream renames the baseline file,
      change it here, in the Taskfile, and in this action's README
      together.
    required: false
    default: 'docs/smell-baseline.json'
  fail-on-new:
    description: 'Fail the job when findings exceed the baseline. Set false for advisory-only.'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Emit SARIF and upload to GitHub code-scanning. Requires security-events: write in the calling job.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install mache
      shell: bash
      env:
        MACHE_VERSION: ${{ inputs.mache-version }}
      run: |
        set -euo pipefail
        url="https://github.com/agentic-research/mache/releases/download/${MACHE_VERSION}/mache-linux-amd64"
        echo "Downloading mache ${MACHE_VERSION} from ${url}"
        curl -sSfL "$url" -o "${RUNNER_TEMP}/mache"
        chmod +x "${RUNNER_TEMP}/mache"
        echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

    - name: Check baseline exists
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline }}
      run: |
        set -euo pipefail
        if [ ! -f "$BASELINE" ]; then
          echo "::error::mache find-smells: no baseline at '${BASELINE}'."
          echo "::error::Bootstrap it once and commit the file, then re-run:"
          echo "::error::  mache build . smells.db && mache find-smells --db smells.db --rule '*' --tags=gate --limit 100000 --baseline-root \"\$PWD\" --write-baseline ${BASELINE}"
          exit 1
        fi

    # Core invocation contract: the find-smells calls below mirror the
    # `smells` target in mache's own Taskfile (build, then
    # `find-smells --rule '*' --tags=gate --limit 100000 --baseline-root --baseline`).
    # cmd/find_smells_action_test.go asserts the two invocation shapes
    # stay in sync — change them together. Reconverged at v0.17.0
    # (mache-3ac299): both gates run the `--tags=gate` ratchet rule set
    # (min-0 firehoses excluded).
    - name: Build index
      shell: bash
      env:
        SCHEMA: ${{ inputs.schema }}
      run: |
        set -euo pipefail
        if [ -n "$SCHEMA" ]; then
          # The leyline backend (preferred by the default backend=auto)
          # ignores build-time schemas; force the in-process tree-sitter
          # backend so the caller's schema is actually honored.
          mache build --schema "$SCHEMA" --backend tree-sitter . "${RUNNER_TEMP}/repo.db"
        else
          mache build . "${RUNNER_TEMP}/repo.db"
        fi

    - name: Generate SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mache find-smells --db "${RUNNER_TEMP}/repo.db" --rule '*' --tags=gate --limit 100000 \
          --baseline-root "$PWD" --format sarif > "${RUNNER_TEMP}/mache.sarif"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
      with:
        sarif_file: ${{ runner.temp }}/mache.sarif

    - name: Job summary
      shell: bash
      run: |
        set -euo pipefail
        mache find-smells --db "${RUNNER_TEMP}/repo.db" --rule '*' --tags=gate --limit 100000 \
          --baseline-root "$PWD" --format md >> "$GITHUB_STEP_SUMMARY"

    - name: Ratchet gate
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline }}
        FAIL_ON_NEW: ${{ inputs.fail-on-new }}
      run: |
        set -uo pipefail
        mache find-smells --db "${RUNNER_TEMP}/repo.db" --rule '*' --tags=gate --limit 100000 \
          --baseline-root "$PWD" --baseline "$BASELINE"
        code=$?
        if [ "$FAIL_ON_NEW" != "true" ] && [ "$code" -eq 1 ]; then
          echo "::warning::mache find-smells: new findings above baseline (advisory; fail-on-new=false)"
          exit 0
        fi
        exit $code
