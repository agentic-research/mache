version: '3'

# Golden path: CI and local dev both use these tasks.
# Workflows (.github/workflows/) should call `task <name>`, never raw go/cargo.

vars:
  BINARY_NAME: bin/mache

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Build, codesign, and install mache to ~/.local/bin
    deps: [build]
    cmds:
      - mkdir -p ~/.local/bin
      - cp {{.BINARY_NAME}} ~/.local/bin/mache
      - cmd: codesign -s - --force --deep --entitlements entitlements.plist ~/.local/bin/mache
        platforms: [darwin]

  build:
    desc: Build and codesign mache
    vars:
      GIT_COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
      BUILD_DATE:
        sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
      # Honest build version: the clean tag on a tagged build (e.g. v0.10.0),
      # else a git-distance string (v0.9.0-9-gabc1234), else the version.txt
      # base when git is unavailable. cmd.Version strips the leading "v".
      GIT_VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || cat internal/buildinfo/version.txt
    cmds:
      # cmd.Version is injected from `git describe` so the binary's reported
      # version tracks the built code. The CLEAN release base still lives in
      # internal/buildinfo (version.txt); server.json + melange derive from
      # that, not from this build string.
      - >-
        go build         -ldflags "-X github.com/agentic-research/mache/cmd.Commit={{.GIT_COMMIT}}
        -X github.com/agentic-research/mache/cmd.Date={{.BUILD_DATE}}
        -X github.com/agentic-research/mache/cmd.buildVersion={{.GIT_VERSION}}"
        -o {{.BINARY_NAME}} .
      # No leading ./ — BINARY_NAME may be an absolute path (CI overrides it,
      # e.g. find-smells builds to /tmp/mache); ./ would yield .//tmp/mache.
      - cmd: codesign -s - --force --deep --entitlements entitlements.plist {{.BINARY_NAME}}
        platforms: [darwin]
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - entitlements.plist
      # go:embed'd assets are baked into the binary — a change to any of them
      # yields a different binary, but Task's up-to-date check skips the rebuild
      # unless they're listed here. Omitting them left a STALE binary on a
      # rule-only edit, which the smell gate (deps:[build]) then ran against —
      # producing phantom "NEW findings" and masking an incomplete rule fix
      # (mache-46af85). Keep this list in sync with the //go:embed directives.
      - "cmd/rules/*.json"
      - "cmd/schemas/*.json"
      - "cmd/schemas/sarif.tmpl"
      - "internal/buildinfo/version.txt"
    generates:
      - "{{.BINARY_NAME}}"

  version:
    desc: Print the canonical mache version (internal/buildinfo/version.txt)
    cmds:
      - cmd: cat internal/buildinfo/version.txt
        silent: true

  version:check:
    desc: |
      Assert the version is single-sourced — internal/buildinfo/version.txt
      must agree with melange.yaml's `version:` field, and (when a tag exists
      at HEAD) with the git tag. Run before cutting a release.
    silent: true
    cmds:
      - |
        set -euo pipefail
        VER="$(tr -d '[:space:]' < internal/buildinfo/version.txt)"
        MELANGE="$(awk '/^  version:/{print $2; exit}' melange.yaml)"
        if [ "$VER" != "$MELANGE" ]; then
          echo "version drift: buildinfo=$VER melange.yaml=$MELANGE — reconcile both to the same value"
          exit 1
        fi
        TAG="$(git tag --points-at HEAD | grep '^v' | head -1 || true)"
        if [ -n "$TAG" ] && [ "$TAG" != "v$VER" ]; then
          echo "version drift: git tag at HEAD=$TAG but buildinfo=v$VER"
          exit 1
        fi
        echo "version OK: $VER (melange=$MELANGE${TAG:+, tag=$TAG})"

  test:
    desc: Run all tests
    cmds:
      # -timeout 20m (go test defaults to 10m/package): the cmd integration
      # suite runs right at the 10m boundary on the slower macOS CI runner and
      # intermittently trips `panic: test timed out after 10m0s` (mache-9cd0f5).
      # This target is the single source CI invokes (ci.yml + integration.yml
      # both `task test`), so the bump keeps local == CI.
      - go test -tags boltdb -race -timeout 20m -v ./...

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  lint:
    desc: Run golangci-lint
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint required — install: https://golangci-lint.run/usage/install/"
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code (gofumpt) + changed markdown (mdformat, matching the pre-commit hook)
    cmds:
      - gofumpt -w -extra .
      - task: fmt:md

  deps:surface:
    desc: |
      Report each external dependency's USAGE SURFACE — how many distinct
      symbols mache actually uses from it, thinnest first. Deps at or below the
      thin threshold are inline/remove candidates and must carry a justification
      in internal/lint/dep_surface_test.go (the gate runs automatically under
      `task test`; this target is just the human-readable view).
    cmds:
      - go test ./internal/lint/ -run TestDependencySurface -count=1 -v

  fmt:md:
    desc: |
      mdformat the markdown you've changed (modified + new), using the same
      mdformat + plugins the pre-commit hook pins. Run this (or `task fmt`)
      before `git add` and the commit-time hook is a no-op instead of
      reformatting your files out from under you and aborting the commit.
      Scoped to CHANGED files — not all tracked markdown — so it never
      rewrites test fixtures (cmd/testdata/**) or vendored docs. Excludes
      .beads/ and testdata/snapshots/, matching the hook's exclusion.
    preconditions:
      - sh: command -v mdformat
        msg: "mdformat required — pip install mdformat mdformat-gfm mdformat-frontmatter"
    cmds:
      - |
        # Union of working-tree-modified, untracked, and staged markdown —
        # so it works whether you run it before or after `git add`.
        { git ls-files -mo --exclude-standard '*.md'; \
          git diff --cached --name-only -- '*.md'; } \
          | sort -u \
          | grep -vE '^(\.beads/|testdata/snapshots/)' \
          | while IFS= read -r f; do [ -f "$f" ] && mdformat "$f"; done

  fmt:check:
    desc: |
      Fail if any file isn't gofumpt-clean (CI-safe — diffs instead of
      writing). Pins gofumpt so CI and local pre-commit agree; this is the
      single source for the gofumpt invocation the lint workflow runs.
    vars:
      GOFUMPT_VERSION: v0.9.2
    cmds:
      - go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
      - gofumpt -d -extra . | tee /dev/stderr | (! grep .)

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY_NAME}}
      - rm -f coverage.out coverage.html
      - rm -rf packages mache.tar
      - rm -f melange.rsa melange.rsa.pub

  image:
    desc: Build OCI image (melange + apko) → mache.tar, tagged from internal/buildinfo/version.txt
    preconditions:
      - sh: command -v melange
        msg: "melange required — install: https://github.com/chainguard-dev/melange"
      - sh: command -v apko
        msg: "apko required — install: https://github.com/chainguard-dev/apko"
    cmds:
      # Reproducible keygen: regenerate when either half of the keypair
      # is missing — `melange build` needs `melange.rsa` and `apko build`
      # needs `melange.rsa.pub` in the keyring, so they must exist together
      # or both be (re)generated. CI should inject a fixed keypair from a
      # secret for byte-stable artifacts.
      - test -f melange.rsa -a -f melange.rsa.pub || melange keygen melange.rsa
      - melange build melange.yaml --arch x86_64,aarch64 --signing-key melange.rsa --out-dir ./packages
      - apko build apko.yaml "mache:$(tr -d '[:space:]' < internal/buildinfo/version.txt)" mache.tar --keyring-append melange.rsa.pub
      - 'echo "Built mache.tar — load with: docker load -i mache.tar"'

  image:verify:
    desc: "Build Dockerfile.release with the pinned leyline binary and run it — catches glibc/lib runtime mismatches between the image base and ley-line-open's binary BEFORE a release (the release image job can't be dry-run without a tag)."
    preconditions:
      - sh: command -v docker
        msg: "docker required — https://docs.docker.com/get-docker/"
      - sh: command -v curl
        msg: "curl required — install curl"
    cmds:
      - |
        set -euo pipefail
        LL=$(grep -oE 'leylineBinaryVersion = "v[0-9.]+"' internal/leyline/socket.go | grep -oE 'v[0-9.]+')
        case "$(uname -m)" in arm64|aarch64) A=arm64 ;; x86_64|amd64) A=amd64 ;; *) echo "unsupported arch $(uname -m)"; exit 1 ;; esac
        BASE=$(grep -E '^FROM ' Dockerfile.release | tail -1 | awk '{print $2}')
        echo "verifying leyline $LL (linux/$A) runs on Dockerfile.release base $BASE"
        # Dockerfile.release COPYs from image/linux-$A/{mache,leyline}; the mache
        # binary is a stub here (this target validates leyline's runtime deps vs
        # the base — the real mache is exercised end-to-end by the release job).
        trap 'rm -rf image; docker rmi mache-image-verify:local >/dev/null 2>&1 || true' EXIT
        rm -rf image; mkdir -p "image/linux-$A"
        printf '#!/bin/sh\necho stub\n' > "image/linux-$A/mache"
        curl -sSfL "https://github.com/agentic-research/ley-line-open/releases/download/$LL/leyline-linux-$A" -o "image/linux-$A/leyline"
        chmod +x "image/linux-$A/mache" "image/linux-$A/leyline"
        docker build -q -f Dockerfile.release --build-arg "TARGETARCH=$A" --platform "linux/$A" -t mache-image-verify:local . >/dev/null
        docker run --rm --platform "linux/$A" --entrypoint /usr/local/bin/leyline mache-image-verify:local --version
        echo "image:verify OK — leyline runs in the release image base"

  validate:
    desc: Validate example schemas against synthetic SQLite fixtures
    cmds:
      - go test -v -run 'TestEngine_IngestSQLite' ./internal/ingest/

  test-go-schema:
    desc: Validate Go schema by ingesting mache's own source tree (self-hosting smoke test)
    deps: [build]
    cmds:
      - go test -v -run 'TestEngine_IngestTreeSitter_Go' ./internal/ingest/

  leyline:ensure:
    desc: "Provision the pinned ley-line binary into the local cache (~/.mache/bin) so the sole-parser projection tests RUN deterministically instead of skipping. CI runs this before `task test` — otherwise projection tests skip on a cold cache and green CI falsely implies they ran (mache-01c467). Idempotent: a no-op when the pinned binary is already cached."
    deps: [build]
    cmds:
      - |
        set -euo pipefail
        SRC="$(mktemp -d)"; DB="$(mktemp -t mache-llwarm.XXXXXX.db)"
        printf 'package p\nfunc warm() {}\n' > "$SRC/warm.go"
        # `mache build` → autoInvokeLeylineParse → ResolveBinary(true), which
        # downloads the pinned leyline into ~/.mache/bin if absent (SHA-verified).
        ./{{.BINARY_NAME}} build "$SRC" "$DB" >/dev/null
        rm -rf "$SRC" "$DB"
        echo "leyline provisioned into local cache"

  test:ast:
    desc: "ASTWalker correctness over real leyline _ast — fast named signal (skips if the pinned leyline isn't cached; never downloads). Replaces the retired sitter↔AST parity gate — in-process tree-sitter was removed in ADR-0012 step 4 (mache-37ae8b), so there is no second projector to be parity WITH."
    cmds:
      - go test -run 'ExtractAddressRefs|InferFromASTDB|ASTWalker|FlattenASTDB' ./internal/ingest/ ./internal/lattice/

  profile-tools:
    desc: E2E harness — exercise every MCP tool, emit per-tool latency/alloc manifest (mache-6b6da6)
    cmds:
      # E2E_PROFILE_OUT controls manifest emission; the test always
      # logs a summary table to stdout regardless. Latency + alloc
      # only; rerun with `task profile-tools-pprof` to also capture
      # pprof CPU/heap artifacts.
      #
      # Use absolute path because `go test ./cmd/` runs with cwd
      # set to cmd/, not the project root — relative paths land
      # under cmd/.e2e/ otherwise.
      - mkdir -p {{.ROOT_DIR}}/.e2e
      - E2E_PROFILE_OUT={{.ROOT_DIR}}/.e2e/tool-profile.json go test -v -run 'TestE2E_AllMCPTools' ./cmd/
      - echo "manifest -> .e2e/tool-profile.json"

  profile-tools-pprof:
    desc: E2E harness with per-tool pprof CPU + heap capture (mache-6b6da6 phase 2)
    cmds:
      # Adds pprof capture: each tool runs through E2E_CPU_ITERATIONS
      # calls under runtime/pprof.StartCPUProfile (default 500 to
      # cross the 100Hz sampler threshold) plus a heap snapshot.
      # Per-tool .cpu.pprof + .heap.pprof land in .e2e/pprof/.
      # Total runtime ~3-8s depending on iteration count.
      #
      # Open with `go tool pprof .e2e/pprof/<tool>.cpu.pprof` for
      # the interactive REPL, or run `task flamegraphs` to render
      # SVG flamegraphs (real flamegraphs, not call graphs — needs
      # brendangregg's FlameGraph scripts on PATH; the task checks
      # for them and prints install instructions if missing).
      - mkdir -p {{.ROOT_DIR}}/.e2e/pprof
      - E2E_PROFILE_OUT={{.ROOT_DIR}}/.e2e/tool-profile.json E2E_CAPTURE_PPROF=1 go test -v -run 'TestE2E_AllMCPTools' ./cmd/
      - echo "manifest -> .e2e/tool-profile.json"
      - echo "pprof    -> .e2e/pprof/*.{cpu,heap}.pprof"
      - echo "next     -> task flamegraphs"

  flamegraphs:
    desc: Render SVG flamegraphs from .e2e/pprof/*.pprof (mache-6b6da6 phase 3)
    cmds:
      # Real flamegraphs via brendangregg/FlameGraph scripts.
      # `pprof -svg` emits a call graph, not a flamegraph (Copilot
      # caught this on PR #361). The standard tool for static
      # flamegraph SVGs is brendangregg/FlameGraph; not vendored
      # here because it's CDDL+GPL perl into an Apache 2.0 Go
      # project — license fragmentation isn't worth the convenience.
      #
      # Install:
      #   macOS:  brew install flamegraph
      #   Linux:  git clone https://github.com/brendangregg/FlameGraph
      #           and add the dir to PATH
      #
      # Pipeline per profile:
      #   go tool pprof -raw <profile>
      #     | stackcollapse-go.pl    # collapse Go stacks
      #     | flamegraph.pl --title  # render SVG
      #     > <tool>.<kind>.svg
      - cmd: |
          if ! command -v flamegraph.pl >/dev/null 2>&1 || ! command -v stackcollapse-go.pl >/dev/null 2>&1; then
            echo "flamegraph.pl + stackcollapse-go.pl required — install via:"
            echo "  macOS: brew install flamegraph"
            echo "  Linux: git clone https://github.com/brendangregg/FlameGraph && add to PATH"
            exit 1
          fi
      - cmd: |
          if [ ! -d {{.ROOT_DIR}}/.e2e/pprof ]; then
            echo "no pprof artifacts in .e2e/pprof/ — run 'task profile-tools-pprof' first"
            exit 1
          fi
      - cmd: |
          cd {{.ROOT_DIR}}/.e2e/pprof
          # CPU profiles: pprof -raw → stackcollapse-go.pl
          # → flamegraph.pl. Some tools have 0 CPU samples (their
          # 500-iteration loop completed under the 10ms sampler
          # tick); skip those quietly with a placeholder note in
          # the SVG so INDEX.md stays consistent.
          for prof in *.cpu.pprof; do
            [ -f "$prof" ] || continue
            tool=$(basename "$prof" .cpu.pprof)
            collapsed=$(go tool pprof -raw "$prof" 2>/dev/null | stackcollapse-go.pl 2>/dev/null)
            if [ -z "$collapsed" ]; then
              echo "<svg xmlns='http://www.w3.org/2000/svg'><text y='20'>$tool: no CPU samples (tool too fast for 100Hz sampler at this iteration count)</text></svg>" > "$tool.cpu.svg"
              continue
            fi
            echo "$collapsed" \
              | flamegraph.pl --title="$tool CPU" --colors=go \
              > "$tool.cpu.svg"
          done
          # Heap profiles use a baseline + diff to filter out
          # init-time allocation noise (jsonschema, sqlite,
          # tree-sitter package init dominate the cumulative view
          # otherwise — see Image #2 reading on PR #361). Each
          # tool has two snapshots: <tool>.heap.baseline.pprof
          # captured before the iteration loop, <tool>.heap.pprof
          # captured after.
          #
          # Use `-alloc_space -base=baseline` to surface BYTES
          # ALLOCATED DURING THE LOOP (column 2 of the 4-column
          # heap raw format). `-inuse_space` would show "live at
          # snapshot but not live at baseline" which is near-zero
          # for short loops where allocs get GC'd before the
          # second snapshot — the real signal is alloc_space.
          #
          # Pprof's raw still emits the 4-column format even with
          # the -alloc_space filter; sed drops cols 3-4 so
          # stackcollapse-go.pl's 2-column regex matches.
          for prof in *.heap.pprof; do
            [ -f "$prof" ] || continue
            # Skip the baseline files — only iterate the AFTER snapshots.
            case "$prof" in *.heap.baseline.pprof) continue ;; esac
            tool=$(basename "$prof" .heap.pprof)
            baseline="$tool.heap.baseline.pprof"
            if [ ! -f "$baseline" ]; then
              echo "<svg xmlns='http://www.w3.org/2000/svg'><text y='20'>$tool: missing baseline; cannot compute heap delta</text></svg>" > "$tool.heap.svg"
              continue
            fi
            collapsed=$(
              go tool pprof -alloc_space -base="$baseline" -raw "$prof" 2>/dev/null \
                | sed -E 's/^( *[0-9]+ +[0-9]+) +[0-9]+ +[0-9]+:/\1:/' \
                | stackcollapse-go.pl 2>/dev/null
            )
            if [ -z "$collapsed" ]; then
              echo "<svg xmlns='http://www.w3.org/2000/svg'><text y='20'>$tool: no heap delta (loop allocations were fully GC'd)</text></svg>" > "$tool.heap.svg"
              continue
            fi
            echo "$collapsed" \
              | flamegraph.pl --title="$tool heap delta (alloc_space, baseline-subtracted)" --colors=mem --countname=bytes \
              > "$tool.heap.svg"
          done
      - cmd: |
          cd {{.ROOT_DIR}}/.e2e
          {
            echo "# E2E tool flamegraphs"
            echo ""
            echo "Generated by \`task flamegraphs\` from .e2e/pprof/*.pprof artifacts."
            echo "See [tool-profile.json](tool-profile.json) for the per-tool manifest."
            echo ""
            echo "| Tool | CPU | Heap | Profile |"
            echo "|------|-----|------|---------|"
            for prof in pprof/*.cpu.pprof; do
              tool=$(basename "$prof" .cpu.pprof)
              echo "| $tool | [cpu.svg](pprof/$tool.cpu.svg) | [heap.svg](pprof/$tool.heap.svg) | [pprof](pprof/$tool.cpu.pprof) |"
            done
          } > INDEX.md
      - echo "flamegraphs -> .e2e/pprof/*.{cpu,heap}.svg"
      - echo "index       -> .e2e/INDEX.md"

  fuzz-gen:
    desc: Generate a new "Fuzz-Mutate-Repair" task by breaking a target
    dir: tools/fuzz-gen
    cmds:
      - go run main.go -file subject/parser.go -target FuzzParseToken

  smells:dogfood:
    desc: "Dogfood — index this repo and PRINT all standalone find_smells findings (no gate; see `task smells` for the ratchet gate)"
    deps: [build]
    vars:
      DB: /tmp/mache-smells.db
    cmds:
      # Mirror what the find-smells GHA does (.github/workflows/find-smells.yml)
      # so local results match what the workflow will report on a PR.
      # The five rules below are the standalone (no-LLO) set that work
      # against node_defs / node_refs / nodes — the same ones the GHA runs.
      - rm -f {{.DB}}
      - ./{{.BINARY_NAME}} build --schema examples/go-schema.json . {{.DB}}
      # --limit 1000 matches the GHA so local dogfood produces the
      # same finding set as a CI run on the same revision (the GHA
      # then filters to PR-changed files; locally we don't, since
      # the goal is "see everything in main").
      - for rule in dead_code untested_function duplicate_definitions fan_out_skew god_file; do
          printf "\n=== %s ===\n" "$rule";
          ./{{.BINARY_NAME}} find-smells --db {{.DB}} --rule "$rule" --format md --limit 1000;
        done

  docs:lint:
    desc: Sanity-check docs/*.md frontmatter against CHANGELOG and internal/lang/lang.go
    cmds:
      - bash scripts/docs-lint.sh

  actions:lint:
    desc: Fail if any .github/workflows `uses:` ref is not SHA-pinned (supply-chain; mache-b8900d)
    cmds:
      - bash scripts/actions-pin-lint.sh

  lint:actions:
    desc: "Lint GitHub Actions workflows — actionlint (semantics + shellcheck) + the SHA-pin gate (mache-466a65)"
    deps: [actions:lint]
    cmds:
      # actionlint: prefer an installed binary (fast local dev), else `go run`
      # the pinned module — go-toolchain-safe, so CI needs no separate install.
      - >-
        command -v actionlint >/dev/null 2>&1 && actionlint
        || go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  lint:yaml:
    desc: "Lint tracked CI/build YAML with yamllint (relaxed .yamllint config; mache-466a65)"
    cmds:
      # Guard (gate-preflight): require yamllint, with an install hint. Lint only
      # TRACKED yaml (excludes gitignored scratch + testdata fixtures by
      # construction) so the gate is stable regardless of local scratch.
      - >-
        command -v yamllint >/dev/null 2>&1
        || { echo "yamllint required — install: pip install yamllint"; exit 1; };
        git ls-files '*.yml' '*.yaml' | grep -vE 'testdata/' | xargs yamllint -c .yamllint

  # Shared internal step: build a leyline _ast .db from the TRACKED tree only,
  # then run the `gate`-tagged rules with the given find-smells baseline flag
  # ($BASELINE_FLAG). This is the SINGLE smell gate — mache-608a3c consolidated
  # the former pure-Go tree-sitter `smells` gate onto leyline. The _ast .db is a
  # strict SUPERSET of the old pure-Go .db (it carries node_defs/node_refs/nodes
  # AND _ast/_ast_pointer), so every `gate`-tagged rule runs with zero coverage
  # loss and the CGO tree-sitter backend is no longer needed for the gate
  # (mache-37ae8b, CGO removal).
  #
  # Tracked-only (git archive HEAD) is the PARITY fix: leyline < v0.7.2 does not
  # respect .gitignore (ley-line-open-a8e4ce; fixed in v0.7.2 PR #178), so
  # building `.` would ingest a dev's untracked scratch and diverge from CI's
  # clean checkout. Uses `git archive | tar` — portable across BSD/GNU (an
  # earlier `git ls-files | cpio -0` copied ZERO files on macOS's BSD cpio,
  # silently emptying the baseline; mache-c380d2). HEAD == exactly what CI checks
  # out. Building into a real temp dir ($SRC) also makes the gate immune to the
  # $PWD-symlink baseline-root mismatch that broke the old `.`/$PWD pure-Go gate
  # (~/github -> ~/remotes: $PWD symlink != the binary's canonicalized build
  # root, so every finding mismatched the baseline and showed as NEW).
  smells:run:
    internal: true
    deps: [build]
    cmds:
      - |
        set -euo pipefail
        command -v tar >/dev/null 2>&1 || { echo "tar required (git archive extract)"; exit 1; }
        SRC="$(mktemp -d)"; DB="$(mktemp -t mache-smells.XXXXXX.db)"
        trap 'rm -rf "$SRC" "$DB"' EXIT
        git archive HEAD | tar -x -C "$SRC"
        ./{{.BINARY_NAME}} build "$SRC" "$DB" --backend leyline >/dev/null
        # --tags=gate scopes to the excess-shaped ratchet rules; the min-0
        # firehoses (cyclomatic_complexity/magic_int_in_comparison) are NOT gated.
        ./{{.BINARY_NAME}} find-smells --db "$DB" --rule '*' --tags=gate --limit 100000 \
          --baseline-root "$SRC" {{.BASELINE_FLAG}} docs/smell-baseline.json >/dev/null

  smells:
    desc: "Structural smell gate over the leyline _ast projection — fail on NEW findings vs docs/smell-baseline.json. Single backend (leyline, pure-Go pipeline), tracked-files-only (parity-safe). mache-608a3c / mache-4da90e."
    cmds:
      - task: smells:run
        vars: { BASELINE_FLAG: "--baseline" }

  smells:baseline:
    desc: "Regenerate docs/smell-baseline.json (leyline _ast projection) — grandfather current structural debt after a deliberate change or a leyline version bump"
    cmds:
      - task: smells:run
        vars: { BASELINE_FLAG: "--write-baseline" }
      - echo "regenerated docs/smell-baseline.json"

  coverage-gate:
    desc: Run the diff-aware NEW-CODE coverage gate against the current branch
    vars:
      # Override BASE=<ref> on the command line for non-default base branches
      # (e.g. `task coverage-gate BASE=origin/feat/godfile-decomposition`).
      BASE: '{{.BASE | default "origin/main"}}'
      DIFF: /tmp/.coverage-gate.diff
      COV: /tmp/.coverage-gate.cov
    cmds:
      # IMPORTANT: -B5% -M5% -C5% are required for rename/copy/break-rewrite
      # detection to fire — plain `git diff` does not emit `similarity index`
      # or `dissimilarity index` headers, so the gate's -rename-threshold
      # logic becomes a no-op. See tools/coverage-gate/main.go package
      # docstring for full rationale.
      - git diff -B5% -M5% -C5% {{.BASE}}...HEAD > {{.DIFF}}
      - go test -coverprofile={{.COV}} ./...
      - go run ./tools/coverage-gate {{.COV}} {{.DIFF}}

  fixtures:snapshot:
    desc: 'Snapshot an external repo into testdata/snapshots/ via the curation filter (ADR-0019 D.7). Args: id=<fixture-id> source=<path>'
    cmds:
      # The fixture id MUST already exist in testdata/snapshots/manifest.toml.
      # The tool reads the language + dest path from the manifest, runs
      # the curation filter (source files per lang.Registry + project
      # markers + docs; no build outputs or SCM metadata), and prints
      # the source HEAD SHA so the caller can update manifest.toml's
      # `sha` field manually.
      - go run ./tools/fixtures-snapshot --id {{.id}} --source {{.source}}
    silent: false

  fixtures:rebaseline:
    desc: 'Update a perf baseline with audit trail (ADR-0019 D.6). Args: key=<rule:variant> fixture=<id> wall_ms=<new-ms> justification=<text>'
    cmds:
      # Fixed-anchor policy: this is the ONLY sanctioned path to bump
      # wall_ms for a (key, fixture) pair in baselines.toml. The tool
      # refuses to create new anchors silently — to add a new gate,
      # append the entry manually first. See ADR-0019 D.6 for why
      # auto-rebaseline was rejected.
      - go run ./tools/fixtures-rebaseline --key {{.key}} --fixture {{.fixture}} --wall-ms {{.wall_ms}} --justification "{{.justification}}"
    silent: false

  gen:server-json:
    desc: |
      Regenerate server.json from internal/mcpregistry (ToolRegistry +
      CloisterGroups). Self-maintaining MCP Registry surface
      (bead mache-802d2b). Run before committing any change to the MCP
      tool surface or cloister-group partitioning.
    cmds:
      - go run ./tools/server-json-gen/ > server.json
      - echo "regenerated server.json"

  gen:version:
    desc: |
      Stamp the clean release version from internal/buildinfo/version.txt into
      the artifacts that require a stable semver — melange.yaml + server.json —
      then verify single-sourcing. Release flow: edit version.txt, run
      `task gen:version`, commit, tag `v<version>`. (sed not yq, so CI without
      yq still works; the .bak dance is portable across BSD/GNU sed.)
    cmds:
      - |
        VER="$(tr -d '[:space:]' < internal/buildinfo/version.txt)"
        sed -i.bak -E "s/^  version:.*/  version: ${VER}/" melange.yaml && rm -f melange.yaml.bak
        echo "stamped melange.yaml version: ${VER}"
      - task: gen:server-json
      - task: version:check

  gen:server-json:check:
    desc: |
      Verify the committed server.json matches what server-json-gen
      would emit today. CI invariant — fails the build on drift. Same
      discipline ley-line-open uses for its server.json.
    cmds:
      - |
        EXPECTED="$(go run ./tools/server-json-gen/)"
        ACTUAL="$(cat server.json)"
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "server.json is stale — run 'task gen:server-json' and commit"
          echo "--- diff ---"
          diff <(echo "$EXPECTED") <(echo "$ACTUAL") || true
          exit 1
        fi
        echo "server.json is up to date"

  gates:preflight:
    desc: "Static preflight — fail if any gate task invokes an external binary with no guard (preconditions / command -v / go install / test -f). See internal/lint + tools/gate-preflight."
    cmds:
      # go/go run is toolchain-safe, so this gate needs no precondition itself.
      - go run ./tools/gate-preflight Taskfile.yml

  check:
    desc: "Dev gate (mutating: `fmt` rewrites files with -w). For the non-mutating 1:1-with-CI gate use `task ci`."
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test:ast
      - task: test
      - task: validate
      - task: docs:lint
      - task: lint:actions
      - task: lint:yaml
      - task: smells
      - task: gates:preflight
      - task: gen:server-json:check

  ci:
    # The pre-push git hook (.pre-commit-config.yaml, stages: [pre-push]) invokes
    # THIS, so a push CI would reject fails locally first. CI itself currently runs
    # the same underlying task targets as separate jobs (task test/vet/fmt:check +
    # the golangci-lint action) rather than this single `task ci` call — the dedup
    # is at the TASK level: both sides invoke the same task definitions and never
    # re-implement the commands inline (the principle from the version
    # single-sourcing work). Folding CI onto one `task ci` invocation is a
    # follow-up. Non-mutating: fmt:check verifies instead of rewriting, so a dirty
    # tree fails the gate. `task test:ast` is a fast named signal for ASTWalker correctness over
    # real leyline `_ast` (the sitter parity gate was retired with CGO removal).
    desc: Non-mutating CI-equivalent gate — run this (or let the pre-push hook) to be 1:1 with CI before pushing
    cmds:
      - task: test:ast
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test
      - task: validate
      - task: docs:lint
      - task: lint:actions
      - task: lint:yaml
      - task: smells
      - task: gates:preflight
      - task: gen:server-json:check

  # ────────────────────────────────────────────────────────────────
  # Portable cache (bead mache-aeb262)
  # ────────────────────────────────────────────────────────────────

  cache:test:
    desc: Run the cache push/pull/OCI test suite
    cmds:
      - go test -v -count=1 ./cmd/ -run "TestCache|TestOCI"

  cache:roundtrip:
    desc: End-to-end self-test — build a tiny db, push, pull, diff
    summary: |
      Builds a synthetic mache db, runs `mache cache push` to emit a
      lockfile + chunks, runs `mache cache pull` to restore into a
      fresh db, diffs the two _source tables. Exits 1 on any drift.

      Usage: task cache:roundtrip
      Used by .github/workflows/cache-roundtrip.yml as a CI smoke test
      that the cache feature still works end-to-end.
    cmds:
      - go test -v -count=1 -run "TestCachePushPull_RoundTrip|TestCacheRemoteRoundTrip" ./cmd/
