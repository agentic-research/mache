apiVersion: v1
kind: Service
metadata:
  name: mache-fixture
  labels:
    app: mache
    tier: backend
spec:
  selector:
    app: mache
  ports:
    - protocol: TCP
      port: 80
      targetPort: 7532
    - protocol: TCP
      port: 7533
      targetPort: 7533
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mache-fixture
spec:
  replicas: 3
  template:
    metadata:
      labels:
        app: mache
    spec:
      containers:
        - name: mache
          image: ghcr.io/agentic-research/mache:latest
          ports:
            - containerPort: 7532
          env:
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7532

---
description: |
  This is a literal block scalar so the block_scalars selector
  has something to match on. It can span multiple lines without
  being interpreted as YAML structure.
script: >
  This is a folded scalar that joins
  multiple lines into a single line.
