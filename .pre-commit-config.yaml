repos:
  # >>> rsry-managed (do not edit between these markers; `rsry hooks install` regenerates) >>>
  - repo: local
    hooks:
      - id: rsry-bead-sync
        name: rsry bead export sync (rosary-00f2b5)
        entry: rsry hooks run pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
  # <<< rsry-managed <<<
  # Markdown formatting
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
        # Snapshot fixtures (ADR-0019) MUST stay byte-identical to the
        # upstream source — reformatting them would erase the "this is
        # rosary at SHA X" provenance and could change test results
        # for the doc-drift rules that read these files. Same rationale
        # as .beads/ — vendored content owned by another repo.
        exclude: '^(\.beads/|testdata/snapshots/)'

  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      # File-content hooks all skip testdata/snapshots/ — the snapshot
      # fixtures (ADR-0019) are byte-identical copies of upstream code;
      # any normalization invalidates the snapshot's provenance.
      - id: trailing-whitespace
        exclude: '^testdata/snapshots/'
      - id: end-of-file-fixer
        # .beads/beads.jsonl is regenerated fresh from Dolt by the rsry
        # pre-commit hook on every run, without a trailing newline. Without
        # this exclude, end-of-file-fixer "fixes" it, the next commit
        # invocation re-exports it (dropping the newline again), and every
        # commit in the repo fails end-of-file-fixer forever. check-added-large-files
        # and mdformat already exclude .beads/ for the same reason (vendored
        # content owned by another process) — this hook was just missed.
        exclude: '^(\.beads/|testdata/snapshots/)'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: '^(\.beads/|internal/treesitter/.*/parser\.c$)'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        exclude: '^testdata/snapshots/'

  # Go-specific checks (all use locally installed tools)
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        entry: gofumpt -w -extra
        language: system
        files: \.go$
        pass_filenames: true

      - id: go-vet
        name: go vet
        entry: bash -c 'if [ "$(uname)" = "Darwin" ] && [ -d /Library/Frameworks/fuse_t.framework ]; then export CGO_CFLAGS="-I/Library/Frameworks/fuse_t.framework/Versions/Current/Headers" CGO_LDFLAGS="-F/Library/Frameworks -framework fuse_t -Wl,-rpath,/Library/Frameworks"; fi && go vet ./...'
        language: system
        files: \.go$
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'if [ "$(uname)" = "Darwin" ] && [ -d /Library/Frameworks/fuse_t.framework ]; then export CGO_CFLAGS="-I/Library/Frameworks/fuse_t.framework/Versions/Current/Headers" CGO_LDFLAGS="-F/Library/Frameworks -framework fuse_t -Wl,-rpath,/Library/Frameworks"; fi && golangci-lint run --fix'
        language: system
        files: \.go$
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: (go\.mod|go\.sum)$
        pass_filenames: false

      # Pre-PUSH gate (not commit): run the SAME non-mutating CI-equivalent
      # gate CI runs, so a push that CI would reject fails locally first.
      # `task ci` is the single source of truth (Taskfile) — this hook never
      # re-implements the commands, it just invokes the task. Install once with:
      #   pre-commit install --hook-type pre-push
      - id: task-ci
        name: task ci (1:1 with CI — full gate before push)
        entry: task ci
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
